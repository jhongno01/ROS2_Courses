turtlebot_autonomous_gap_drive:
  ros__parameters:
    scan_topic: /scan
    imu_topic: /imu
    odom_topic: /odom
    cmd_vel_topic: /cmd_vel
    cmd_vel_stamped: false
    auto_start: false
    reset_heading_on_start: true

    control_period_ms: 100
    report_period_ms: 1000

    max_linear_speed: 0.15
    min_linear_speed: 0.03
    max_angular_speed: 0.75

    emergency_stop_distance_m: 0.05
    front_stop_distance_m: 0.15
    front_slow_distance_m: 0.35
    side_stop_distance_m: 0.10
    safe_gap_distance_m: 0.35
    target_distance_cap_m: 1.00

    search_angle_deg: 105.0
    gap_window_deg: 22.0
    sample_step_deg: 3.0
    front_window_deg: 18.0
    side_angle_deg: 70.0
    side_window_deg: 18.0

    heading_gain: 1.55
    centering_gain: 0.55
    forward_bias_weight: 0.55
    turn_slowdown_gain: 0.65
    recovery_turn_speed: 0.75
    recovery_flip_seconds: 4.0
    lost_scan_timeout_seconds: 1.0
    prefer_left_recovery: true

    tilt_stop_deg: 60.0
    imu_timeout_seconds: 1.0
    gyro_yaw_sign: 1.0
    gyro_angular_deadband_rad_s: 0.01
    gyro_integration_max_dt_seconds: 0.25
    odom_timeout_seconds: 1.0

    reverse_heading_threshold_deg: 150.0
    reverse_hold_seconds: 2.0
    reverse_linear_threshold: 0.02
    heading_recovery_turn_speed: 0.60
    reverse_resume_threshold_deg: 45.0

    stuck_recovery_enabled: true
    stuck_command_linear_threshold: 0.03
    stuck_odom_linear_threshold: 0.01
    stuck_min_progress_m: 0.03
    stuck_hold_seconds: 3.0
    stuck_backup_speed: 0.04
    stuck_backup_seconds: 0.8
    stuck_turn_speed: 0.60
    stuck_turn_seconds: 1.0
    stuck_cooldown_seconds: 2.0

    enforce_gap_width: true
    min_passage_width_m: 0.24
    gap_width_search_deg: 45.0
    gap_width_obstacle_max_range_m: 1.20
